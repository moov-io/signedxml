name: Go

on:
  push:
    branches: [ master ]
    paths-ignore:
      - "docs/bench/**"
      - ".github/workflows/bench.yml"
      - ".github/workflows/codeql.yml"
      - ".github/workflows/fuzz.yml"
      - ".github/workflows/macos.yml"
      - ".github/workflows/zizmor.yml"
  pull_request:
    branches: [ master ]
    paths-ignore:
      - "docs/bench/**"
      - ".github/workflows/bench.yml"
      - ".github/workflows/codeql.yml"
      - ".github/workflows/fuzz.yml"
      - ".github/workflows/macos.yml"
      - ".github/workflows/zizmor.yml"

permissions:
  contents: read

jobs:
  build:
    name: Go Build (CGO)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # macOS is in macos.yml so hosted-runner capacity cancels do not fail this workflow.
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
    - name: Set up Go 1.x
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: stable
      id: go

    - name: Check out code into the Go module directory
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Test (Unix)
      if: runner.os != 'Windows'
      run: |
        make check

    - name: Test (Windows)
      if: runner.os == 'Windows'
      run: |
        go vet ./...
        go test -v ./...
